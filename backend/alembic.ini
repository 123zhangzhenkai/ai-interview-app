[alembic]
script_location = alembic
prepend_sys_path = .
# This URL is overridden by alembic/env.py via settings.database_url (placeholder only).
sqlalchemy.url = mysql+aiomysql://offer_ai:offer_ai_pass@127.0.0.1:3306/offer_ai?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
