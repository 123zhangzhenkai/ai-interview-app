<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>offerAI 智能面试官</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ========== 登录页 ========== -->
  <div id="view-login" class="view login-view">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-badge">AI</span>
        <h1>offerAI</h1>
        <p class="slogan">AI 智能面试官 · 助你拿 offer</p>
      </div>

      <div class="tabs">
        <button class="tab active" id="tab-login" type="button">登录</button>
        <button class="tab" id="tab-reg" type="button">注册</button>
      </div>

      <form id="auth-form" novalidate>
        <div class="field">
          <label for="f-phone">手机号</label>
          <input id="f-phone" type="tel" maxlength="11" placeholder="请输入 11 位手机号" autocomplete="tel" />
        </div>
        <div class="field" id="pwd-row">
          <label for="f-pwd">密码</label>
          <input id="f-pwd" type="password" maxlength="64" placeholder="至少 6 位" autocomplete="current-password" />
        </div>
        <div class="field" id="pwd2-row" hidden>
          <label for="f-pwd2">确认密码</label>
          <input id="f-pwd2" type="password" maxlength="64" placeholder="再次输入密码" autocomplete="new-password" />
        </div>
        <p class="tip" id="reg-tip" hidden>注册码由系统自动填充，直接输入即可完成注册</p>
        <button class="btn-primary btn-block" id="auth-submit" type="submit">登 录</button>
      </form>

      <p class="err-msg" id="auth-err"></p>
    </div>
  </div>

  <!-- ========== 主应用 ========== -->
  <div id="view-app" class="view app-view" hidden>
    <header class="topbar">
      <div class="topbar-brand">
        <span class="logo-badge small">AI</span>
        <span class="brand-name">offerAI 面试官</span>
      </div>
      <div class="topbar-user">
        <span class="user-phone" id="cur-phone"></span>
        <button class="btn-ghost btn-sm" id="btn-logout" type="button">退出</button>
      </div>
    </header>

    <div class="layout">
      <!-- 左侧：历史会话 -->
      <aside class="sidebar">
        <h2 class="side-title">面试记录</h2>
        <ul class="history-list" id="history-list">
          <li class="empty-history">还没有面试记录<br />从右侧开始你的第一场面试吧</li>
        </ul>
      </aside>

      <!-- 右侧：主区域 -->
      <main class="main" id="main">
        <!-- 空态：开始面试 -->
        <section class="start-view" id="start-view">
          <div class="start-inner">
            <div class="start-icon">🎯</div>
            <h2>开启一场 AI 模拟面试</h2>
            <p class="start-sub">输入岗位名称，AI 面试官将围绕该岗位向你提问并给出反馈</p>
            <div class="job-chips" id="job-chips">
              <button type="button" class="chip">前端工程师</button>
              <button type="button" class="chip">后端工程师</button>
              <button type="button" class="chip">产品经理</button>
              <button type="button" class="chip">数据分析师</button>
              <button type="button" class="chip">测试工程师</button>
            </div>
            <div class="job-input-row">
              <input id="job-input" type="text" maxlength="40" placeholder="输入目标岗位，如：前端工程师" />
              <button class="btn-primary" id="btn-start" type="button">开始面试</button>
            </div>
          </div>
        </section>

        <!-- 对话中：聊天面板 -->
        <section class="chat-view" id="chat-view" hidden>
          <div class="chat-head">
            <div class="chat-head-left">
              <span class="avatar">AI</span>
              <div>
                <div class="chat-title" id="chat-job">面试官</div>
                <div class="chat-sub" id="chat-status">模拟面试中</div>
              </div>
            </div>
            <button class="btn-danger btn-sm" id="btn-end" type="button">结束面试</button>
          </div>
          <div class="chat-body" id="chat-body"></div>
          <div class="chat-input-row">
            <input id="answer-input" type="text" maxlength="1000" placeholder="输入你的回答，Enter 发送" />
            <button class="btn-primary send" id="btn-send" type="button">发送</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
